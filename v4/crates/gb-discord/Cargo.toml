[package]
name = "gb-discord"
description = "Good Boy 4: the connection to Discord. Turns Discord's events into the core's plain events and carries out what the core asks for."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gb-core = { path = "../gb-core" }
gb-data = { path = "../gb-data" }
gb-art = { path = "../gb-art" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.21"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
fastrand = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# music in voice: the voice connection and audio decoding, and fetching songs, lyrics and yt-dlp
songbird = { version = "0.6.1", default-features = false, features = ["driver", "rustls", "tws"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "ogg", "vorbis", "wav", "pcm", "flac", "mkv"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
