[package]
name = "gb-host"
description = "Good Boy 4: what a program that hosts the bot needs. Where things are kept, the first run, the saved token and client secret, and starting and stopping the bot."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
gb-data = { path = "../gb-data" }
gb-core = { path = "../gb-core" }
gb-discord = { path = "../gb-discord" }
gb-art = { path = "../gb-art" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
base64 = "0.21"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
getrandom = "0.2"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true

# secrets are kept in the operating system's own credential store (Windows Credential Manager, macOS Keychain)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
