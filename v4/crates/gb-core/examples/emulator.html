<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Boy emulator</title>
<style>
:root { --bg: #313338; --side: #2b2d31; --dark: #1e1f22; --text: #dbdee1; --mute: #949ba4; --line: #3f4147; --blurple: #5865f2; --green: #248046; --red: #da373c; --grey: #4e5058; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.375 "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
header { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--dark); font-weight: 600; }
header .hash { color: var(--mute); font-size: 22px; font-weight: 400; }
header .topic { color: var(--mute); font-weight: 400; font-size: 13px; margin-left: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#log { flex: 1; overflow-y: auto; padding: 16px 0 8px; }
.msg { display: grid; grid-template-columns: 56px minmax(0, 1fr); padding: 2px 16px 2px 0; margin-top: 14px; }
.msg:hover { background: #2e3035; }
.av { width: 40px; height: 40px; border-radius: 50%; margin-left: 16px; display: grid; place-items: center; font-size: 20px; background: linear-gradient(135deg, #7b9dff, #c08bff); }
.av.you { background: #5865f2; font-size: 15px; font-weight: 700; color: #fff; }
.who { display: flex; align-items: baseline; gap: 6px; }
.who b { color: #fff; font-weight: 500; }
.tag { background: var(--blurple); color: #fff; font-size: 10px; font-weight: 600; padding: 0 4px; border-radius: 3px; position: relative; top: -1px; }
.time { color: var(--mute); font-size: 12px; }
.used { color: var(--mute); font-size: 13px; margin: 0 0 2px; }
.used b { color: #00a8fc; font-weight: 500; }
.eph { color: var(--mute); font-size: 12px; margin-top: 4px; }
.eph span { color: #00a8fc; }
.container { background: var(--side); border: 1px solid var(--line); border-left: 4px solid var(--accent, #7b9dff); border-radius: 8px; padding: 12px 16px; max-width: 600px; display: grid; gap: 8px; margin-top: 4px; }
.txt h3 { margin: 0 0 2px; font-size: 16px; color: #f2f3f5; font-weight: 700; }
.txt h1 { margin: 2px 0; font-size: 24px; color: #f2f3f5; }
.txt .sub { font-size: 12px; color: var(--mute); }
.txt code { background: var(--dark); padding: 0 4px; border-radius: 3px; font: 13px Consolas, "Andale Mono", monospace; }
.txt pre { background: var(--dark); border: 1px solid #1a1b1e; border-radius: 4px; padding: 8px; margin: 4px 0; font: 13px Consolas, "Andale Mono", monospace; overflow-x: auto; }
.txt blockquote { margin: 0; padding-left: 10px; border-left: 4px solid var(--grey); }
.mention { background: #5865f24d; color: #c9cdfb; border-radius: 3px; padding: 0 2px; }
.gallery img { display: block; max-width: 100%; border-radius: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 0; border-radius: 8px; min-height: 32px; padding: 4px 14px; font: 500 14px inherit; color: #fff; cursor: pointer; background: var(--grey); display: inline-flex; align-items: center; gap: 6px; }
.btn.s1 { background: var(--blurple); } .btn.s3 { background: var(--green); } .btn.s4 { background: var(--red); }
.btn:hover:not(:disabled) { filter: brightness(1.12); } .btn:disabled { opacity: 0.5; cursor: not-allowed; }
select.sel, .multi { width: 100%; max-width: 400px; background: var(--dark); color: var(--text); border: 1px solid var(--dark); border-radius: 8px; padding: 9px 10px; font: 14px inherit; }
.multi { display: grid; gap: 4px; max-height: 190px; overflow-y: auto; } .multi label { display: flex; gap: 8px; align-items: center; }
footer { flex: none; padding: 0 16px 16px; }
.bar { background: #383a40; border-radius: 8px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar span { color: var(--mute); font-size: 13px; margin-right: 4px; }
.chip { background: var(--dark); color: #00a8fc; border: 0; border-radius: 6px; padding: 6px 10px; font: 500 14px inherit; cursor: pointer; }
.chip:hover { background: #111214; }
#modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.sheet { background: var(--bg); border-radius: 8px; width: min(440px, 100%); max-height: 90vh; overflow-y: auto; }
.sheet h2 { margin: 0; padding: 16px; font-size: 20px; color: #f2f3f5; }
.sheet .body { padding: 0 16px 16px; display: grid; gap: 14px; }
.sheet label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #b5bac1; letter-spacing: 0.02em; }
.sheet label small { text-transform: none; font-weight: 400; color: var(--mute); letter-spacing: 0; }
.sheet input, .sheet textarea, .sheet select { background: var(--dark); color: var(--text); border: 0; border-radius: 4px; padding: 10px; font: 15px inherit; width: 100%; }
.sheet .foot { background: var(--side); padding: 14px 16px; display: flex; justify-content: flex-end; gap: 8px; border-radius: 0 0 8px 8px; }
.note { color: var(--mute); font-size: 12px; padding: 0 16px 6px; }
</style>
</head>
<body>
<header><span class="hash">#</span>games<span class="topic">Good Boy emulator: the real bot's code, shown the way Discord shows it. Nothing here touches Discord.</span></header>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="bar"><span>Use a command:</span>
    <button class="chip" data-cmd="ticket" data-sub="panel">/ticket panel</button><button class="chip" data-cmd="ticket" data-sub="open">/ticket open</button><button class="chip" data-cmd="fish">/fish</button><button class="chip" data-cmd="slots">/slots</button><button class="chip" data-cmd="blackjack">/blackjack</button><button class="chip" data-cmd="coinflip">/coinflip</button><button class="chip" data-cmd="hangman">/hangman</button><button class="chip" data-cmd="tower">/tower</button><button class="chip" data-cmd="wires">/wires</button><button class="chip" data-cmd="bingo">/bingo</button><button class="chip" data-cmd="memory">/memory</button><button class="chip" data-cmd="trivia">/trivia</button><button class="chip" data-cmd="pong">/pong</button><button class="chip" data-cmd="balance">/balance</button><button class="chip" data-cmd="daily">/daily</button>
  </div>
</footer>
<div id="modal" hidden><form class="sheet" id="sheet"></form></div>
<script>
(function () {
  var log = document.getElementById("log"), modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  function clock() { var d = new Date(); return "Today at " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function inline(s) {
    return esc(s)
      .replace(/&lt;@&amp;(\d+)&gt;/g, '<span class="mention">@role</span>').replace(/&lt;@!?(\d+)&gt;/g, '<span class="mention">@You</span>').replace(/&lt;#(\d+)&gt;/g, '<span class="mention">#channel</span>')
      .replace(/&lt;t:(\d+):R&gt;/g, function (_, t) { var m = Math.round((t * 1000 - Date.now()) / 60000); var a = Math.abs(m); var txt = a < 60 ? a + " minute" + (a === 1 ? "" : "s") : a < 1440 ? Math.round(a / 60) + " hours" : Math.round(a / 1440) + " days"; return m >= 0 ? "in " + txt : txt + " ago"; })
      .replace(/&lt;t:(\d+)(:\w)?&gt;/g, function (_, t) { return new Date(t * 1000).toLocaleString(); })
      .replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:#00a8fc">$1</a>');
  }
  function markdown(src) {
    var out = [], lines = String(src).split("\n"), code = null;
    lines.forEach(function (l) {
      if (l.trim().indexOf("```") === 0) { if (code === null) code = []; else { out.push("<pre>" + esc(code.join("\n")) + "</pre>"); code = null; } return; }
      if (code !== null) { code.push(l); return; }
      if (l.indexOf("### ") === 0) out.push("<h3>" + inline(l.slice(4)) + "</h3>");
      else if (l.indexOf("# ") === 0) out.push("<h1>" + inline(l.slice(2)) + "</h1>");
      else if (l.indexOf("-# ") === 0) out.push('<div class="sub">' + inline(l.slice(3)) + "</div>");
      else if (l.indexOf("> ") === 0) out.push("<blockquote>" + inline(l.slice(2)) + "</blockquote>");
      else out.push("<div>" + (inline(l) || "&nbsp;") + "</div>");
    });
    return out.join("");
  }
  function emoji(e) { return e && e.name ? e.name + " " : ""; }
  function renderParts(parts, files, host) {
    var box = document.createElement("div");
    (parts || []).forEach(function (p) {
      if (p.type === 17) {
        var c = document.createElement("div"); c.className = "container";
        if (p.accent_color != null) c.style.setProperty("--accent", "#" + ("000000" + p.accent_color.toString(16)).slice(-6));
        c.appendChild(renderParts(p.components, files, host)); box.appendChild(c);
      } else if (p.type === 10) { var t = document.createElement("div"); t.className = "txt"; t.innerHTML = markdown(p.content); box.appendChild(t); }
      else if (p.type === 9) { var s = document.createElement("div"); s.style.cssText = "display:flex;gap:12px;justify-content:space-between"; s.appendChild(renderParts(p.components, files, host)); if (p.accessory && p.accessory.media) { var im = new Image(); im.src = p.accessory.media.url; im.style.cssText = "width:72px;height:72px;border-radius:8px;object-fit:cover"; im.onerror = function () { im.remove(); }; s.appendChild(im); } box.appendChild(s); }
      else if (p.type === 12) { var g = document.createElement("div"); g.className = "gallery"; (p.items || []).forEach(function (it) { var u = it.media.url, img = new Image(); if (u.indexOf("attachment://") === 0) { var f = (files || []).filter(function (x) { return x.name === u.slice(13); })[0]; if (!f) return; img.src = "data:image/" + (/\.gif$/.test(f.name) ? "gif" : "png") + ";base64," + f.data; } else img.src = u; img.alt = "The game's picture"; g.appendChild(img); }); box.appendChild(g); }
      else if (p.type === 1) {
        var r = document.createElement("div"); r.className = "row";
        (p.components || []).forEach(function (b) {
          if (b.type === 2) {
            if (b.url) { var a = document.createElement("a"); a.className = "btn"; a.href = b.url; a.target = "_blank"; a.rel = "noopener"; a.style.textDecoration = "none"; a.textContent = emoji(b.emoji) + (b.label || "") + " ↗"; r.appendChild(a); return; }
            var e = document.createElement("button"); e.className = "btn s" + b.style; e.type = "button"; e.textContent = emoji(b.emoji) + (b.label || ""); e.disabled = !!b.disabled;
            e.onclick = function () { send({ op: "button", id: b.custom_id, values: [] }, host); }; r.appendChild(e);
          } else if (b.type === 3) {
            if ((b.max_values || 1) > 1) {
              var m = document.createElement("div"); m.className = "multi";
              b.options.forEach(function (o) { var l = document.createElement("label"); l.innerHTML = '<input type="checkbox" value="' + esc(o.value) + '"> ' + esc(emoji(o.emoji) + o.label); m.appendChild(l); });
              var go = document.createElement("button"); go.className = "btn s1"; go.type = "button"; go.textContent = "Confirm selection";
              go.onclick = function () { var v = Array.prototype.map.call(m.querySelectorAll("input:checked"), function (i) { return i.value; }); if (v.length) send({ op: "button", id: b.custom_id, values: v }, host); };
              r.style.display = "grid"; r.appendChild(m); r.appendChild(go);
            } else {
              var sel = document.createElement("select"); sel.className = "sel"; sel.innerHTML = '<option value="">' + esc(b.placeholder || "Make a selection") + "</option>" + b.options.map(function (o) { return '<option value="' + esc(o.value) + '">' + esc(emoji(o.emoji) + o.label) + "</option>"; }).join("");
              sel.onchange = function () { if (sel.value) send({ op: "button", id: b.custom_id, values: [sel.value] }, host); }; r.appendChild(sel);
            }
          }
        });
        box.appendChild(r);
      }
    });
    return box;
  }
  function message(card, used) {
    var m = document.createElement("div"); m.className = "msg";
    m.innerHTML = '<div class="av">🐶</div><div class="col">' + (used ? '<div class="used"><b>You</b> used <b>' + esc(used) + "</b></div>" : "") + '<div class="who"><b>Good Boy</b><span class="tag">APP</span><span class="time">' + clock() + '</span></div><div class="body"></div></div>';
    fill(m, card); log.appendChild(m); log.scrollTop = log.scrollHeight; return m;
  }
  function fill(m, card) {
    var body = m.querySelector(".body"); body.innerHTML = "";
    body.appendChild(renderParts(card.discord && card.discord.components, card.files, m));
    if (card.private) { var e = document.createElement("div"); e.className = "eph"; e.innerHTML = "👁 Only you can see this · <span>Dismiss message</span>"; body.appendChild(e); }
  }
  function openForm(a, host) {
    sheet.innerHTML = "<h2>" + esc(a.title) + '</h2><div class="body"></div><div class="foot"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn s1">Submit</button></div>';
    var body = sheet.querySelector(".body");
    a.fields.forEach(function (f) {
      var l = document.createElement("label"); l.innerHTML = "<span>" + esc(f.label) + (f.required ? ' <span style="color:#f23f42">*</span>' : "") + "</span>" + (f.desc ? "<small>" + esc(f.desc) + "</small>" : "");
      var input;
      if (f.kind === "select") { input = document.createElement("select"); input.innerHTML = f.options.map(function (o, k) { return '<option value="' + esc(o[1]) + '"' + (o[1] === f.value ? " selected" : "") + ">" + esc(o[0] + (f.hints && f.hints[k] ? "  —  " + f.hints[k] : "")) + "</option>"; }).join(""); }
      else { input = document.createElement(f.long ? "textarea" : "input"); input.value = f.value || ""; input.placeholder = f.placeholder || ""; if (f.max) input.maxLength = f.max; input.required = !!f.required; }
      input.name = f.id; input.id = "f-" + f.id; l.appendChild(input); body.appendChild(l);
    });
    modal.hidden = false; var first = sheet.querySelector("input,select,textarea"); if (first) first.focus();
    document.getElementById("cancel").onclick = function () { modal.hidden = true; };
    sheet.onsubmit = function (ev) { ev.preventDefault(); var v = {}; a.fields.forEach(function (f) { v[f.id] = sheet.elements[f.id].value; }); modal.hidden = true; send({ op: "form", id: a.id, values: v }, host, host ? null : sheet.dataset.used); };
  }
  function apply(actions, host, used) {
    var shown = host;
    actions.forEach(function (a) {
      if (a.t === "update" && shown) fill(shown, a.card);
      else if (a.t === "update" || a.t === "reply" || a.t === "followup") { shown = message(a.card, used); used = null; }
      else if (a.t === "form") { sheet.dataset.used = used || ""; openForm(a, host); }
      else if (a.t === "bite") { var target = shown; setTimeout(function () { post({ op: "bite", id: a.id }).then(function (r) { r.actions.forEach(function (x) { if (x.t === "update" && target) fill(target, x.card); }); }); }, a.after); }
      else if (a.t === "send" || a.t === "dm") { var m = message(a.card, null); var n = document.createElement("div"); n.className = "eph"; n.textContent = a.t === "dm" ? "(sent to you as a direct message)" : "(posted in another channel)"; m.querySelector(".body").appendChild(n); }
    });
  }
  function post(body) { return fetch("api", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function send(body, host, used) {
    // like Discord: the message's buttons wait while the bot answers
    var held = host ? Array.prototype.filter.call(host.querySelectorAll("button, select"), function (b) { return !b.disabled; }) : [];
    held.forEach(function (b) { b.disabled = true; });
    post(body).then(function (r) { held.forEach(function (b) { if (b.isConnected) b.disabled = false; }); apply(r.actions || [], host, used); }).catch(function () { var m = document.createElement("div"); m.className = "note"; m.textContent = "The emulator is not answering. Is it still running?"; log.appendChild(m); }); }
  Array.prototype.forEach.call(document.querySelectorAll("[data-cmd]"), function (b) { b.onclick = function () { send({ op: "command", name: b.dataset.cmd, sub: b.dataset.sub || null, args: {} }, null, "/" + b.dataset.cmd + (b.dataset.sub ? " " + b.dataset.sub : "")); }; });
  var hello = document.createElement("div"); hello.className = "note"; hello.textContent = "This is the start of #games. You have 25,000 coins. Pick a command below.";
  log.appendChild(hello);
})();
</script>
</body>
</html>
