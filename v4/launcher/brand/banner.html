<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:480px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;background:#070b18}
.b{position:relative;width:1200px;height:480px;overflow:hidden;
  background:radial-gradient(620px 420px at 900px 250px,rgba(56,140,255,.55),transparent 70%),radial-gradient(520px 360px at 1120px 470px,rgba(20,210,240,.35),transparent 70%),radial-gradient(700px 500px at 120px -80px,rgba(70,60,220,.35),transparent 70%),linear-gradient(115deg,#060a17 0%,#0b1636 55%,#0e2a66 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(150,190,255,.18) 1px,transparent 1.4px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent 0%,#000 35%,#000 70%,transparent 100%)}
.line{position:absolute;left:-10%;right:-10%;top:72%;height:1px;background:linear-gradient(90deg,transparent,rgba(120,190,255,.45),transparent);transform:rotate(-8deg)}
.m{position:absolute;right:70px;top:50%;width:420px;height:420px;transform:translateY(-50%) rotate(-4deg);filter:drop-shadow(0 18px 40px rgba(0,30,90,.6))}
.t{position:absolute;left:80px;top:50%;transform:translateY(-52%)}
.kick{display:inline-flex;align-items:center;gap:8px;font:600 15px "Inter";letter-spacing:.18em;text-transform:uppercase;color:#8fb8ff}
.kick i{width:22px;height:2px;background:linear-gradient(90deg,#5b8cff,#22d3ee);display:block}
h1{font-weight:900;font-size:118px;line-height:.92;letter-spacing:-.035em;color:#fff;margin-top:14px}
h1 span{background:linear-gradient(100deg,#7aa8ff 0%,#3ee0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:20px;font:500 22px "Inter";color:#b9c7e6;max-width:520px}
.by{margin-top:26px;font:600 14px "Inter";color:#6f7fa6;letter-spacing:.06em}
</style></head><body><div class="b"><div class="dots"></div><div class="line"></div>
<img class="m" src="mascot.png">
<div class="t"><div class="kick"><i></i>Discord bot</div><h1>Good<br><span>Boy</span></h1><p>Your server's best friend. Levels, tickets, moderation,<br>music and games, in one bot you run yourself.</p><div class="by">BASIC GHOST LABS</div></div>
</div></body></html>
